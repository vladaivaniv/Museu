<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIINYL — Vinyl Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="viewport-wrap">
    <div class="stage" id="stage">

      <!-- NAV -->
      <nav class="nav" role="navigation" aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="#">SHOP</a></li>
          <li><a href="#">ARTISTS</a></li>
          <li><a href="#">TOP</a></li>
        </ul>
        <div class="nav-brand">VIINYL</div>
        <div class="nav-hamburger" role="button" tabindex="0" aria-label="Menu">
          <span class="ham-line ham-line--long"></span>
          <span class="ham-line ham-line--short"></span>
        </div>
      </nav>

      <!-- ═══════════════════════════════════════════════════
           SCENE: SELECTOR
      ════════════════════════════════════════════════════ -->
      <section class="scene scene--selector" id="scene-selector" aria-label="Vinyl Selector">

        <p class="selector-heading" aria-hidden="true">SELECT A RECORD</p>

        <div class="selector-rack" id="selector-rack">

          <!-- Vinyl 0: Green — Klark Kent -->
          <button class="selector-item" data-index="0" type="button" aria-label="Don't Care — Klark Kent">
            <div class="selector-disc">
              <svg class="vinyl-svg" viewBox="0 0 200 200" aria-hidden="true">
                <circle cx="100" cy="100" r="100" fill="rgba(22,160,60,0.88)"/>
                <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
                <circle cx="100" cy="100" r="62" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
                <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
                <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
                <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
                <ellipse cx="80" cy="65" rx="30" ry="18" fill="rgba(255,255,255,0.06)" transform="rotate(-35 100 100)"/>
                <circle cx="100" cy="100" r="36" fill="#e8e0d0"/>
                <text x="100" y="96" text-anchor="middle" font-size="5" font-family="sans-serif" font-weight="700" fill="#1a1a1a">DON'T CARE</text>
                <text x="100" y="105" text-anchor="middle" font-size="4" font-family="sans-serif" fill="#555">KLARK KENT</text>
                <circle cx="100" cy="100" r="3.5" fill="#d0cdc8"/>
              </svg>
            </div>
            <div class="selector-meta">
              <span class="selector-title">DON'T CARE</span>
              <span class="selector-artist">KLARK KENT</span>
            </div>
          </button>

          <!-- Vinyl 1: Black — Snips -->
          <button class="selector-item" data-index="1" type="button" aria-label="What's Your Number — Snips">
            <div class="selector-disc">
              <svg class="vinyl-svg" viewBox="0 0 200 200" aria-hidden="true">
                <circle cx="100" cy="100" r="100" fill="#111111"/>
                <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.7"/>
                <circle cx="100" cy="100" r="62" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.7"/>
                <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.7"/>
                <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.7"/>
                <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.7"/>
                <ellipse cx="80" cy="65" rx="28" ry="16" fill="rgba(255,255,255,0.04)" transform="rotate(-35 100 100)"/>
                <circle cx="100" cy="100" r="36" fill="#c8784a"/>
                <text x="100" y="97" text-anchor="middle" font-size="4.5" font-family="sans-serif" font-weight="700" fill="#fff">WHAT'S YOUR</text>
                <text x="100" y="106" text-anchor="middle" font-size="4.5" font-family="sans-serif" font-weight="700" fill="#fff">NUMBER</text>
                <circle cx="100" cy="100" r="3.5" fill="#f5f5f0"/>
              </svg>
            </div>
            <div class="selector-meta">
              <span class="selector-title">WHAT'S YOUR NUMBER</span>
              <span class="selector-artist">SNIPS</span>
            </div>
          </button>

        </div>
      </section>

      <!-- ═══════════════════════════════════════════════════
           SCENE: DETAIL
      ════════════════════════════════════════════════════ -->
      <section class="scene scene--detail" id="scene-detail" aria-label="Vinyl Detail">

        <!-- Back button -->
        <button class="btn-back" id="btn-back" type="button" aria-label="Back to all records">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          ALL RECORDS
        </button>

        <!-- Vinyl wrap: static cover + spinning disc -->
        <div class="detail-vinyl-wrap" id="detail-vinyl-wrap">

          <!-- Static album cover (does not spin) -->
          <div class="detail-cover" id="detail-cover"></div>

          <!-- Disc 0: Green vinyl -->
          <div class="detail-disc" id="detail-disc-0">
            <svg class="vinyl-svg" viewBox="0 0 200 200" aria-hidden="true">
              <circle cx="100" cy="100" r="100" fill="rgba(20,160,55,0.82)"/>
              <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="52.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="55" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="65" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <ellipse cx="80" cy="65" rx="30" ry="18" fill="rgba(255,255,255,0.06)" transform="rotate(-35 100 100)"/>
              <circle cx="100" cy="100" r="42" fill="#e8e0d0"/>
              <circle cx="100" cy="100" r="41" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
              <text x="100" y="93" text-anchor="middle" font-size="5.5" font-family="sans-serif" font-weight="700" fill="#1a1a1a" letter-spacing="0.5">DON'T CARE</text>
              <text x="100" y="101" text-anchor="middle" font-size="4" font-family="sans-serif" fill="#555" letter-spacing="0.3">A&amp;M RECORDS</text>
              <text x="100" y="109" text-anchor="middle" font-size="4.5" font-family="sans-serif" font-weight="600" fill="#1a1a1a" letter-spacing="0.3">KLARK KENT</text>
              <circle cx="100" cy="100" r="4.5" fill="#f5f5f0"/>
              <circle cx="100" cy="100" r="3" fill="#d0cdc8"/>
            </svg>
          </div>

          <!-- Disc 1: Black vinyl -->
          <div class="detail-disc" id="detail-disc-1">
            <svg class="vinyl-svg" viewBox="0 0 200 200" aria-hidden="true">
              <circle cx="100" cy="100" r="100" fill="#111111"/>
              <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="52.5" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="55" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="65" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"/>
              <ellipse cx="80" cy="65" rx="28" ry="16" fill="rgba(255,255,255,0.04)" transform="rotate(-35 100 100)"/>
              <circle cx="100" cy="100" r="40" fill="#c8784a"/>
              <circle cx="100" cy="100" r="39" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
              <text x="100" y="90" text-anchor="middle" font-size="5.5" font-family="sans-serif" font-weight="700" fill="#fff" letter-spacing="0.5">EMI 5040</text>
              <text x="100" y="99" text-anchor="middle" font-size="4" font-family="sans-serif" fill="rgba(255,255,255,0.8)" letter-spacing="0.3">WHAT'S YOUR NUMBER</text>
              <text x="100" y="108" text-anchor="middle" font-size="4.5" font-family="sans-serif" font-weight="600" fill="#fff" letter-spacing="0.3">SNIPS</text>
              <circle cx="100" cy="100" r="4.5" fill="#f5f5f0"/>
              <circle cx="100" cy="100" r="3" fill="#d0cdc8"/>
            </svg>
          </div>

        </div>

        <!-- Info panel -->
        <div class="detail-info" id="detail-info">
          <h1 class="detail-title" id="detail-title"></h1>
          <p class="detail-desc" id="detail-desc"></p>
          <button class="hero-purchase-btn" type="button">PURCHASE <span aria-hidden="true">&#8594;</span></button>
        </div>

      </section>

      <!-- GRAIN OVERLAY -->
      <div class="grain-overlay" aria-hidden="true"></div>

      <!-- ARROW BUTTONS (detail navigation) -->
      <div class="ui-arrows" id="ui-arrows">
        <button class="arrow-btn" id="btn-prev" type="button" aria-label="Previous vinyl">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <button class="arrow-btn" id="btn-next" type="button" aria-label="Next vinyl">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="9 6 15 12 9 18"/>
          </svg>
        </button>
      </div>

    </div><!-- /stage -->
  </div><!-- /viewport-wrap -->

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
