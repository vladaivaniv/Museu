<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinilo — Galería de Arte en Movimiento</title>
  <meta name="description" content="Galería de arte interactiva. Desplázate para explorar obras maestras presentadas como vinilos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #f0c040;
      --vinyl-size: min(70vmin, 460px);
      --label-ratio: 0.42;
      --hole-ratio: 0.045;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Space Grotesk', sans-serif;
      color: #f5f0e8;
    }

    /* ── Skip / SR ── */
    .skip-link {
      position: fixed; top: -100%; left: 1rem; z-index: 9999;
      padding: .6rem 1.2rem; background: var(--accent); color: #000;
      font-size: .9rem; font-weight: 700; border-radius: 4px;
      text-decoration: none; transition: top .2s;
    }
    .skip-link:focus { top: 1rem; }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
    }

    /* ── Scroll viewport (transparent, captures wheel/touch) ── */
    #viewport {
      position: fixed; inset: 0; z-index: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      background: transparent;
      scrollbar-width: none;
    }
    #viewport::-webkit-scrollbar { display: none; }

    .snap-section {
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    /* ── Visual stage (fixed, pointer-events none so scroll passes through) ── */
    #stage {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Atmosphere ── */
    #atmosphere {
      position: absolute; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── Particles ── */
    #particle-canvas {
      position: absolute; inset: 0; z-index: 1;
      pointer-events: none; opacity: .5;
    }

    /* ── Header ── */
    #site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.4rem 2.5rem;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,.75) 0%, transparent 100%);
      pointer-events: none;
    }
    .logo {
      font-size: clamp(.65rem, 1.4vw, .8rem);
      font-weight: 300; letter-spacing: .55em;
      text-transform: uppercase; color: rgba(255,255,255,.35);
    }
    .scroll-hint {
      font-size: .65rem; letter-spacing: .3em; text-transform: uppercase;
      color: rgba(255,255,255,.25);
      animation: fadeOut 3s ease 2s forwards;
    }
    @keyframes fadeOut { to { opacity: 0; } }

    /* ── Dot nav ── */
    #dot-nav {
      position: fixed; right: 1.8rem; top: 50%;
      transform: translateY(-50%); z-index: 200;
      display: flex; flex-direction: column; gap: .9rem; list-style: none;
    }
    #dot-nav li button {
      display: block; width: 5px; height: 5px;
      border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25);
      background: transparent; cursor: pointer; padding: 0;
      transition: background .4s, border-color .4s, transform .4s;
    }
    #dot-nav li button[aria-current="true"] {
      background: var(--accent); border-color: var(--accent); transform: scale(2);
    }
    #dot-nav li button:hover { border-color: var(--accent); transform: scale(1.5); }
    #dot-nav li button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 3px;
    }

    /* ── Counter ── */
    #counter {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%); z-index: 100;
      font-size: .6rem; letter-spacing: .6em;
      text-transform: uppercase; color: rgba(255,255,255,.18);
      pointer-events: none;
    }
    #counter span { color: var(--accent); }

    /* ── Vinyl ── */
    .vinyl-wrapper {
      position: absolute;
      width: var(--vinyl-size); height: var(--vinyl-size);
      will-change: transform;
      z-index: 5;
    }
    .vinyl-disc-outer {
      width: 100%; height: 100%;
      will-change: transform;
    }
    .vinyl-disc {
      position: relative; width: 100%; height: 100%;
      border-radius: 50%; overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05),
        0 30px 80px rgba(0,0,0,.9),
        0 6px 20px rgba(0,0,0,.6);
    }
    .vinyl-grooves {
      position: absolute; inset: 0; border-radius: 50%;
      background: repeating-radial-gradient(
        circle at center,
        #0d0d0d 0px, #1c1c1c 1.5px,
        #0d0d0d 3px, #171717 4.5px,
        #0d0d0d 6px
      );
    }
    .vinyl-tint {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(
        circle at center,
        transparent 30%,
        var(--groove-color, rgba(30,60,100,.18)) 70%,
        rgba(0,0,0,.55) 100%
      );
    }
    .vinyl-sheen {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(255,80,80,.07) 0deg, rgba(255,200,60,.08) 60deg,
        rgba(80,255,100,.06) 120deg, rgba(40,200,255,.08) 180deg,
        rgba(180,40,255,.06) 240deg, rgba(255,80,80,.07) 360deg
      );
      mix-blend-mode: screen;
      animation: spin 2.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vinyl-label {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: calc(var(--label-ratio) * 100%);
      height: calc(var(--label-ratio) * 100%);
      border-radius: 50%; overflow: hidden;
      border: 2.5px solid rgba(255,255,255,.12);
      box-shadow: 0 0 24px rgba(0,0,0,.9), inset 0 0 10px rgba(0,0,0,.5);
    }
    .vinyl-label img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vinyl-label-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: calc((var(--label-ratio) + .05) * 100%);
      height: calc((var(--label-ratio) + .05) * 100%);
      border-radius: 50%;
      border: 1.5px solid var(--accent-color, rgba(240,192,64,.3));
      pointer-events: none;
    }
    .vinyl-hole {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: calc(var(--hole-ratio) * 100%);
      height: calc(var(--hole-ratio) * 100%);
      border-radius: 50%; background: #020202;
      box-shadow: 0 0 8px rgba(0,0,0,1); z-index: 10;
    }

    /* ── Info panel ── */
    .info-panel {
      position: absolute;
      bottom: max(3.5rem, 8vh);
      left: 50%;
      z-index: 10;
      pointer-events: none;
      width: min(90vw, 600px);
      text-align: center;
      will-change: transform, opacity;
    }
    .artwork-year {
      font-size: .6rem; font-weight: 300;
      letter-spacing: .75em; text-transform: uppercase;
      color: var(--accent); margin-bottom: .9rem;
    }
    .artwork-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5.5vw, 3.8rem);
      font-weight: 300; font-style: italic;
      color: rgba(255,255,255,.95);
      line-height: 1.05; margin-bottom: .7rem;
    }
    .artwork-artist {
      font-size: clamp(.65rem, 1.4vw, .78rem);
      font-weight: 300; letter-spacing: .42em;
      text-transform: uppercase; color: rgba(255,255,255,.38);
    }
    .artwork-museum {
      font-size: .58rem; color: rgba(255,255,255,.18);
      margin-top: .5rem; letter-spacing: .12em;
    }

    /* ── Scroll arrow ── */
    #scroll-arrow {
      position: fixed; bottom: 1.8rem; right: 2rem; z-index: 100;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,.15); border-radius: 50%;
      animation: bounce 2s ease-in-out infinite;
      transition: opacity .5s; pointer-events: none;
    }
    #scroll-arrow svg { width: 13px; height: 13px; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(7px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .vinyl-sheen { animation: none !important; }
    }
    @media (max-width: 500px) {
      #dot-nav { right: .7rem; }
      #site-header { padding: 1rem 1.2rem; }
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  </style>
</head>
<body>

  <a href="#gallery" class="skip-link">Saltar al contenido</a>
  <div id="live-region" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <!-- Scroll-snap capture layer (transparent, on top to catch wheel/touch) -->
  <div id="viewport" tabindex="0"></div>

  <!-- Visual layer -->
  <div id="stage" aria-hidden="true">
    <div id="atmosphere"></div>
    <canvas id="particle-canvas"></canvas>
  </div>

  <!-- UI chrome -->
  <header id="site-header" role="banner">
    <span class="logo">Galería · Arte en Vinilo</span>
    <span class="scroll-hint" aria-hidden="true">⬇ Desplaza para explorar</span>
  </header>
  <nav id="dot-nav" aria-label="Navegación de obras"></nav>
  <div id="counter" aria-hidden="true">
    <span id="counter-current">01</span> / <span id="counter-total">06</span>
  </div>
  <div id="scroll-arrow" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2">
      <polyline points="2,5 8,11 14,5"/>
    </svg>
  </div>
  <main id="gallery" class="sr-only" tabindex="-1">Galería de Arte en Vinilo</main>

  <script>
  (() => {
    'use strict';

    const artworks = [
      {
        title: 'La Noche Estrellada',
        artist: 'Vincent van Gogh',
        year: '1889',
        museum: 'Museo de Arte Moderno, Nueva York',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/600px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg',
        alt: 'La Noche Estrellada de Van Gogh: cielo nocturno con remolinos de luz azul y amarillo',
        bg: [10, 20, 50], glow: [30, 80, 180], accent: '#f0c040', grooveTint: 'rgba(30,80,180,0.25)',
      },
      {
        title: 'La Gran Ola de Kanagawa',
        artist: 'Katsushika Hokusai',
        year: 'c. 1831',
        museum: 'Metropolitan Museum of Art',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/The_Great_Wave_off_Kanagawa.jpg/600px-The_Great_Wave_off_Kanagawa.jpg',
        alt: 'La Gran Ola de Kanagawa de Hokusai',
        bg: [5, 18, 38], glow: [20, 100, 180], accent: '#4fb8d4', grooveTint: 'rgba(20,100,180,0.28)',
      },
      {
        title: 'La Joven de la Perla',
        artist: 'Johannes Vermeer',
        year: 'c. 1665',
        museum: 'Mauritshuis, La Haya',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/600px-1665_Girl_with_a_Pearl_Earring.jpg',
        alt: 'La Joven de la Perla de Vermeer',
        bg: [20, 14, 8], glow: [120, 80, 40], accent: '#e8d5a0', grooveTint: 'rgba(120,80,40,0.25)',
      },
      {
        title: 'El Grito',
        artist: 'Edvard Munch',
        year: '1893',
        museum: 'Galería Nacional, Oslo',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg/600px-Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg',
        alt: 'El Grito de Munch',
        bg: [35, 10, 5], glow: [200, 60, 20], accent: '#e84c1f', grooveTint: 'rgba(200,60,20,0.28)',
      },
      {
        title: 'Nenúfares',
        artist: 'Claude Monet',
        year: '1906',
        museum: 'Instituto de Arte de Chicago',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg/600px-Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg',
        alt: 'Nenúfares de Monet',
        bg: [8, 22, 14], glow: [40, 140, 80], accent: '#7fcf9a', grooveTint: 'rgba(40,140,80,0.25)',
      },
      {
        title: 'El Beso',
        artist: 'Gustav Klimt',
        year: '1907–08',
        museum: 'Österreichische Galerie Belvedere, Viena',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg/600px-The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg',
        alt: 'El Beso de Klimt',
        bg: [25, 18, 5], glow: [180, 130, 30], accent: '#f0a820', grooveTint: 'rgba(180,130,30,0.28)',
      },
    ];

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // DOM
    const viewport    = document.getElementById('viewport');
    const stage       = document.getElementById('stage');
    const atmosphere  = document.getElementById('atmosphere');
    const pCanvas     = document.getElementById('particle-canvas');
    const dotNav      = document.getElementById('dot-nav');
    const liveRegion  = document.getElementById('live-region');
    const counterCur  = document.getElementById('counter-current');
    const counterTotal = document.getElementById('counter-total');
    const scrollArrow = document.getElementById('scroll-arrow');

    counterTotal.textContent = String(artworks.length).padStart(2, '0');

    // Snap sections
    artworks.forEach(() => {
      const sec = document.createElement('div');
      sec.className = 'snap-section';
      viewport.appendChild(sec);
    });

    // Build vinyls
    function buildVinyl(aw, idx) {
      const wrapper   = document.createElement('div');
      wrapper.className = 'vinyl-wrapper';
      const discOuter = document.createElement('div');
      discOuter.className = 'vinyl-disc-outer';
      const disc      = document.createElement('div');
      disc.className  = 'vinyl-disc';
      const grooves   = document.createElement('div');
      grooves.className = 'vinyl-grooves';
      const tint      = document.createElement('div');
      tint.className  = 'vinyl-tint';
      tint.style.setProperty('--groove-color', aw.grooveTint);
      const sheen     = document.createElement('div');
      sheen.className = 'vinyl-sheen';
      const ring      = document.createElement('div');
      ring.className  = 'vinyl-label-ring';
      ring.style.setProperty('--accent-color', aw.accent);
      const label     = document.createElement('div');
      label.className = 'vinyl-label';
      const img       = document.createElement('img');
      img.src     = aw.img;
      img.alt     = aw.alt;
      img.loading = idx === 0 ? 'eager' : 'lazy';
      img.width   = 220;
      img.height  = 220;
      const hole      = document.createElement('div');
      hole.className  = 'vinyl-hole';

      label.appendChild(img);
      disc.append(grooves, tint, sheen, ring, label, hole);
      discOuter.appendChild(disc);
      wrapper.appendChild(discOuter);

      const info = document.createElement('div');
      info.className = 'info-panel';
      info.setAttribute('aria-label', `${aw.title}, ${aw.artist}, ${aw.year}`);
      info.innerHTML = `
        <p class="artwork-year">${aw.year}</p>
        <h2 class="artwork-title">${aw.title}</h2>
        <p class="artwork-artist">${aw.artist}</p>
        <p class="artwork-museum">${aw.museum}</p>
      `;
      return { wrapper, discOuter, info };
    }

    const vinyls = artworks.map((aw, i) => {
      const v = buildVinyl(aw, i);
      stage.appendChild(v.wrapper);
      stage.appendChild(v.info);
      return v;
    });

    // Dot nav
    artworks.forEach((aw, i) => {
      const li  = document.createElement('li');
      const btn = document.createElement('button');
      btn.setAttribute('aria-label', `Ir a: ${aw.title}`);
      btn.setAttribute('aria-current', i === 0 ? 'true' : 'false');
      btn.addEventListener('click', () => scrollToArtwork(i));
      li.appendChild(btn);
      dotNav.appendChild(li);
    });

    // Measure vinyl radius
    let vinylRadius = 240;
    function measure() {
      vinylRadius = vinyls[0].wrapper.getBoundingClientRect().width / 2 || 240;
    }
    measure();
    window.addEventListener('resize', measure, { passive: true });

    // Utils
    const lerp  = (a, b, t) => a + (b - a) * t;
    const lerp3 = (c1, c2, t) => [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)];
    const rgb   = (r,g,b,a=1) => `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a})`;
    const hex2rgb = h => h.replace('#','').match(/.{2}/g).map(x => parseInt(x, 16));
    const lerpHex = (h1, h2, t) => {
      const r = lerp3(hex2rgb(h1), hex2rgb(h2), t);
      return `rgb(${Math.round(r[0])},${Math.round(r[1])},${Math.round(r[2])})`;
    };

    // Scroll
    function scrollToArtwork(idx) {
      const i = Math.max(0, Math.min(artworks.length - 1, idx));
      viewport.scrollTo({ top: i * window.innerHeight, behavior: prefersReducedMotion ? 'instant' : 'smooth' });
    }

    // Keyboard
    viewport.addEventListener('keydown', e => {
      const cur = Math.round(viewport.scrollTop / window.innerHeight);
      if (['ArrowDown','PageDown'].includes(e.key)) { e.preventDefault(); scrollToArtwork(cur + 1); }
      else if (['ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); scrollToArtwork(cur - 1); }
      else if (e.key === 'Home') { e.preventDefault(); scrollToArtwork(0); }
      else if (e.key === 'End')  { e.preventDefault(); scrollToArtwork(artworks.length - 1); }
    });

    // Particles
    const pCtx = pCanvas.getContext('2d');
    function resizeCanvas() {
      pCanvas.width  = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas, { passive: true });

    const PARTICLE_COUNT = 55;
    const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
      x:     Math.random() * window.innerWidth,
      y:     Math.random() * window.innerHeight,
      size:  Math.random() * 1.4 + 0.2,
      vx:    (Math.random() - 0.5) * 0.25,
      vy:    -(Math.random() * 0.35 + 0.08),
      alpha: Math.random() * 0.35 + 0.05,
    }));

    function updateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -5) { p.y = pCanvas.height + 5; p.x = Math.random() * pCanvas.width; }
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pCtx.fillStyle = `rgba(255,255,255,${p.alpha})`;
        pCtx.fill();
      }
    }

    // Mouse tilt
    let mx = 0, my = 0, tiltX = 0, tiltY = 0;
    if (!prefersReducedMotion) {
      document.addEventListener('mousemove', e => {
        mx = (e.clientX / window.innerWidth)  * 2 - 1;
        my = (e.clientY / window.innerHeight) * 2 - 1;
      }, { passive: true });
    }

    // Main loop
    let prevActive = -1;
    let floatT = 0;

    function tick(ts) {
      requestAnimationFrame(tick);
      floatT = ts * 0.001;

      const scrollY  = viewport.scrollTop;
      const vh       = window.innerHeight;
      const raw      = scrollY / vh;
      const clamped  = Math.max(0, Math.min(artworks.length - 1, raw));
      const base     = Math.min(Math.floor(clamped), artworks.length - 2);
      const prog     = clamped - base;
      const ease     = t => t < .5 ? 2*t*t : -1+(4-2*t)*t;
      const ep       = ease(Math.min(1, Math.max(0, prog)));
      const travel   = window.innerWidth * 1.25;
      const active   = prog < .5 ? base : base + 1;

      // Smooth tilt
      tiltX = lerp(tiltX, mx * 8,  0.06);
      tiltY = lerp(tiltY, my * 5,  0.06);

      const floatY = Math.sin(floatT * 0.75) * 11;

      artworks.forEach((_, i) => {
        const { wrapper, discOuter, info } = vinyls[i];
        let vx = 0, rot = 0, opVinyl = 0, opInfo = 0, tyInfo = 0, sc = 1;

        if (i === base) {
          vx      = -ep * travel;
          rot     = (Math.abs(vx) / vinylRadius) * (180 / Math.PI);
          opVinyl = 1 - ep * 1.4;
          opInfo  = 1 - ep * 2.5;
          tyInfo  = ep * 22;
          sc      = 1 - ep * 0.05;
        } else if (i === base + 1) {
          vx      = (1 - ep) * travel;
          const totalRot = (travel / vinylRadius) * (180 / Math.PI);
          rot     = totalRot - (Math.abs(vx) / vinylRadius) * (180 / Math.PI);
          opVinyl = Math.min(1, ep * 1.4);
          opInfo  = (ep - .5) * 2.5;
          tyInfo  = (1 - ep) * 32;
          sc      = 0.95 + ep * 0.05;
        } else if (i < base) {
          vx = -travel; rot = (travel / vinylRadius) * (180 / Math.PI); opVinyl = 0;
        } else {
          vx = travel; rot = 0; opVinyl = 0;
        }

        const isActive = i === active;

        if (prefersReducedMotion) {
          wrapper.style.transform = 'none';
          wrapper.style.opacity   = isActive ? '1' : '0';
          info.style.opacity      = isActive ? '1' : '0';
          info.style.transform    = 'translateX(-50%)';
        } else {
          const fy = isActive ? floatY : 0;
          wrapper.style.transform = `translateX(${vx}px) translateY(${fy}px) rotate(${rot}deg) scale(${sc})`;
          wrapper.style.opacity   = String(Math.max(0, Math.min(1, opVinyl)));

          discOuter.style.transform = isActive
            ? `perspective(800px) rotateX(${-tiltY}deg) rotateY(${tiltX}deg)`
            : 'none';

          info.style.opacity   = String(Math.max(0, Math.min(1, opInfo)));
          info.style.transform = `translateX(-50%) translateY(${tyInfo}px)`;
        }

        wrapper.setAttribute('aria-hidden', isActive ? 'false' : 'true');
      });

      // Background
      const bgA  = artworks[base].bg;
      const bgB  = artworks[Math.min(base + 1, artworks.length - 1)].bg;
      const glA  = artworks[base].glow;
      const glB  = artworks[Math.min(base + 1, artworks.length - 1)].glow;
      const acA  = artworks[base].accent;
      const acB  = artworks[Math.min(base + 1, artworks.length - 1)].accent;

      const bg = lerp3(bgA, bgB, ep);
      const gl = lerp3(glA, glB, ep);
      const ac = lerpHex(acA, acB, ep);

      document.body.style.background = rgb(...bg);
      atmosphere.style.background =
        `radial-gradient(ellipse 90% 75% at 50% 56%, ${rgb(...gl, 0.38)} 0%, transparent 70%)`;
      document.documentElement.style.setProperty('--accent', ac);

      // Dots + counter
      dotNav.querySelectorAll('button').forEach((btn, i) =>
        btn.setAttribute('aria-current', i === active ? 'true' : 'false'));
      counterCur.textContent = String(active + 1).padStart(2, '0');

      if (active !== prevActive) {
        const aw = artworks[active];
        liveRegion.textContent = `${aw.title} — ${aw.artist}, ${aw.year}`;
        prevActive = active;
      }

      scrollArrow.style.opacity = clamped >= artworks.length - 1.2 ? '0' : '0.35';

      if (!prefersReducedMotion) updateParticles();
    }

    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
