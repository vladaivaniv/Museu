<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinilo — Galería de Arte en Movimiento</title>
  <meta name="description" content="Galería de arte interactiva. Desplázate para explorar obras maestras presentadas como vinilos que ruedan entre el pasado y el presente.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --accent: #f0c040;
      --groove: #1a3a5c;
      --text: #f5f0e8;
      --vinyl-size: min(72vmin, 480px);
      --label-ratio: 0.42;
      --hole-ratio: 0.045;
    }

    html { scroll-behavior: auto; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    /* ── Skip link ── */
    .skip-link {
      position: fixed;
      top: -100%;
      left: 1rem;
      z-index: 9999;
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: #000;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      text-decoration: none;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 1rem; }

    /* ── Screen-reader only ── */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }

    /* ── Header ── */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.4rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .logo {
      font-size: clamp(0.85rem, 2vw, 1rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      font-style: italic;
    }
    .scroll-hint {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      animation: fadeHint 3s ease 2s forwards;
    }
    @keyframes fadeHint { to { opacity: 0; pointer-events: none; } }

    /* ── Side nav dots ── */
    #dot-nav {
      position: fixed;
      right: 1.8rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      list-style: none;
    }
    #dot-nav li button {
      display: block;
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: background 0.3s, border-color 0.3s, transform 0.3s;
    }
    #dot-nav li button:hover,
    #dot-nav li button:focus-visible {
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      transform: scale(1.3);
    }
    #dot-nav li button[aria-current="true"] {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.25);
    }

    /* ── Counter ── */
    #counter {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    #counter span { color: var(--accent); transition: color 0.6s; }

    /* ── Scroll container ── */
    #scroll-container { /* height set by JS */ }

    /* ── Sticky stage ── */
    #sticky-stage {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Atmosphere (radial background glow) ── */
    #atmosphere {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      transition: background 0.9s ease;
      background: radial-gradient(ellipse 80% 70% at 50% 60%, rgba(30,60,100,0.4) 0%, transparent 70%);
    }

    /* ── Vinyl wrapper (animated) ── */
    .vinyl-wrapper {
      position: absolute;
      width: var(--vinyl-size);
      height: var(--vinyl-size);
      will-change: transform;
    }

    /* ── Vinyl disc ── */
    .vinyl-disc {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 20px 60px rgba(0,0,0,0.8),
        0 4px 16px rgba(0,0,0,0.6);
    }

    /* Grooves via repeating radial gradient */
    .vinyl-grooves {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          circle at center,
          #0d0d0d 0px,
          #191919 1.5px,
          #0d0d0d 3px,
          #161616 4.5px,
          #0d0d0d 6px
        );
    }

    /* Groove tint ring (accent color subtle tint on outer edge) */
    .vinyl-tint {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(
        circle at center,
        transparent 30%,
        var(--groove-color, rgba(30,60,100,0.18)) 70%,
        rgba(0,0,0,0.6) 100%
      );
    }

    /* Iridescent sheen */
    .vinyl-sheen {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 30deg,
        rgba(255,80,80,0.04) 0deg,
        rgba(255,180,40,0.04) 60deg,
        rgba(80,255,80,0.04) 120deg,
        rgba(40,200,255,0.04) 180deg,
        rgba(180,40,255,0.04) 240deg,
        rgba(255,80,80,0.04) 360deg
      );
      mix-blend-mode: screen;
    }

    /* Circular label (artwork image) */
    .vinyl-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(var(--label-ratio) * 100%);
      height: calc(var(--label-ratio) * 100%);
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 8px rgba(0,0,0,0.5);
    }
    .vinyl-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Label ring accent */
    .vinyl-label-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc((var(--label-ratio) + 0.04) * 100%);
      height: calc((var(--label-ratio) + 0.04) * 100%);
      border-radius: 50%;
      border: 1px solid var(--accent-color, rgba(240,192,64,0.4));
      pointer-events: none;
    }

    /* Center hole */
    .vinyl-hole {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(var(--hole-ratio) * 100%);
      height: calc(var(--hole-ratio) * 100%);
      border-radius: 50%;
      background: #050505;
      box-shadow: 0 0 6px rgba(0,0,0,0.9);
      z-index: 10;
    }

    /* ── Artwork info panel ── */
    .info-panel {
      position: absolute;
      bottom: max(3.5rem, 8vh);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s;
      width: min(90vw, 560px);
    }
    .info-panel .artwork-year {
      font-size: 0.72rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
      opacity: 0.85;
    }
    .info-panel .artwork-title {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: normal;
      font-style: italic;
      color: rgba(255,255,255,0.9);
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }
    .info-panel .artwork-artist {
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    .info-panel .artwork-museum {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.25);
      margin-top: 0.6rem;
      letter-spacing: 0.1em;
    }

    /* ── Scroll down arrow ── */
    #scroll-arrow {
      position: fixed;
      bottom: 1.8rem;
      right: 2rem;
      z-index: 100;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      animation: bounce 2s ease-in-out infinite;
      opacity: 0.45;
      pointer-events: none;
    }
    #scroll-arrow svg { width: 16px; height: 16px; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .vinyl-wrapper { transition: opacity 0.6s ease !important; }
      body { transition: background 0.4s ease; }
      #atmosphere { transition: background 0.4s ease; }
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 500px) {
      #dot-nav { right: 0.8rem; }
      #site-header { padding: 1rem 1.2rem; }
    }

    /* ── Focus visible ── */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <a href="#gallery" class="skip-link">Saltar al contenido</a>

  <!-- Live region for screen readers -->
  <div id="live-region" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <header id="site-header" role="banner">
    <span class="logo">Galería · Arte en Vinilo</span>
    <span class="scroll-hint" aria-hidden="true">⬇ Desplaza para explorar</span>
  </header>

  <nav id="dot-nav" aria-label="Navegación de obras"></nav>

  <div id="counter" aria-hidden="true">
    <span id="counter-current">01</span> / <span id="counter-total">06</span>
  </div>

  <div id="scroll-arrow" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2">
      <polyline points="2,5 8,11 14,5"/>
    </svg>
  </div>

  <main id="gallery" tabindex="-1">
    <div id="scroll-container">
      <div id="sticky-stage" role="region" aria-label="Galería de vinilos">
        <div id="atmosphere" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script>
  (() => {
    'use strict';

    // ── Artwork data ──────────────────────────────────────────────────────────
    const artworks = [
      {
        title: 'La Noche Estrellada',
        artist: 'Vincent van Gogh',
        year: '1889',
        museum: 'Museo de Arte Moderno, Nueva York',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/600px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg',
        alt: 'La Noche Estrellada de Van Gogh: cielo nocturno con remolinos de luz azul y amarillo sobre una aldea tranquila',
        bg: [10, 20, 50],
        glow: [30, 80, 180],
        accent: '#f0c040',
        grooveTint: 'rgba(30,80,180,0.25)',
      },
      {
        title: 'La Gran Ola de Kanagawa',
        artist: 'Katsushika Hokusai',
        year: 'c. 1831',
        museum: 'Xilografía ukiyo-e — Metropolitan Museum of Art',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/The_Great_Wave_off_Kanagawa.jpg/600px-The_Great_Wave_off_Kanagawa.jpg',
        alt: 'La Gran Ola de Kanagawa: ola colosal azul marino con espuma blanca amenazando embarcaciones, Monte Fuji al fondo',
        bg: [5, 18, 38],
        glow: [20, 100, 180],
        accent: '#4fb8d4',
        grooveTint: 'rgba(20,100,180,0.28)',
      },
      {
        title: 'La Joven de la Perla',
        artist: 'Johannes Vermeer',
        year: 'c. 1665',
        museum: 'Mauritshuis, La Haya',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/600px-1665_Girl_with_a_Pearl_Earring.jpg',
        alt: 'La Joven de la Perla de Vermeer: retrato de una joven con turbante azul y perla colgante sobre fondo oscuro',
        bg: [20, 14, 8],
        glow: [120, 80, 40],
        accent: '#e8d5a0',
        grooveTint: 'rgba(120,80,40,0.25)',
      },
      {
        title: 'El Grito',
        artist: 'Edvard Munch',
        year: '1893',
        museum: 'Galería Nacional, Oslo',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg/600px-Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg',
        alt: 'El Grito de Munch: figura agonizante en un puente bajo un cielo rojo ondulante sobre un fiordo noruego',
        bg: [35, 10, 5],
        glow: [200, 60, 20],
        accent: '#e84c1f',
        grooveTint: 'rgba(200,60,20,0.28)',
      },
      {
        title: 'Nenúfares',
        artist: 'Claude Monet',
        year: '1906',
        museum: 'Instituto de Arte de Chicago',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg/600px-Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg',
        alt: 'Nenúfares de Monet: flores de nenúfar rosadas sobre superficie de agua verde esmeralda con reflejos del cielo',
        bg: [8, 22, 14],
        glow: [40, 140, 80],
        accent: '#7fcf9a',
        grooveTint: 'rgba(40,140,80,0.25)',
      },
      {
        title: 'El Beso',
        artist: 'Gustav Klimt',
        year: '1907–08',
        museum: 'Österreichische Galerie Belvedere, Viena',
        img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg/600px-The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg',
        alt: 'El Beso de Klimt: pareja enlazada en manto dorado con patrones geométricos florales sobre fondo dorado',
        bg: [25, 18, 5],
        glow: [180, 130, 30],
        accent: '#f0a820',
        grooveTint: 'rgba(180,130,30,0.28)',
      },
    ];

    // ── State ─────────────────────────────────────────────────────────────────
    let currentIndex = 0;
    let vinylRadius = 240;
    let raf = null;
    let lastScrollY = -1;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const stage        = document.getElementById('sticky-stage');
    const atmosphere   = document.getElementById('atmosphere');
    const scrollCont   = document.getElementById('scroll-container');
    const dotNav       = document.getElementById('dot-nav');
    const liveRegion   = document.getElementById('live-region');
    const counterCur   = document.getElementById('counter-current');
    const counterTotal = document.getElementById('counter-total');
    const scrollArrow  = document.getElementById('scroll-arrow');

    // ── Build DOM ─────────────────────────────────────────────────────────────
    function buildVinyl(aw, idx) {
      const wrapper = document.createElement('div');
      wrapper.className = 'vinyl-wrapper';
      wrapper.dataset.index = idx;
      wrapper.setAttribute('aria-hidden', idx !== 0 ? 'true' : 'false');

      const disc = document.createElement('div');
      disc.className = 'vinyl-disc';

      const grooves = document.createElement('div');
      grooves.className = 'vinyl-grooves';

      const tint = document.createElement('div');
      tint.className = 'vinyl-tint';
      tint.style.setProperty('--groove-color', aw.grooveTint);

      const sheen = document.createElement('div');
      sheen.className = 'vinyl-sheen';

      const labelRing = document.createElement('div');
      labelRing.className = 'vinyl-label-ring';
      labelRing.style.setProperty('--accent-color', aw.accent);

      const label = document.createElement('div');
      label.className = 'vinyl-label';

      const img = document.createElement('img');
      img.src = aw.img;
      img.alt = aw.alt;
      img.loading = idx === 0 ? 'eager' : 'lazy';
      img.width = 220;
      img.height = 220;

      const hole = document.createElement('div');
      hole.className = 'vinyl-hole';
      hole.setAttribute('aria-hidden', 'true');

      label.appendChild(img);
      disc.append(grooves, tint, sheen, labelRing, label, hole);
      wrapper.appendChild(disc);

      // Info panel
      const info = document.createElement('div');
      info.className = 'info-panel';
      info.setAttribute('aria-label', `${aw.title}, ${aw.artist}, ${aw.year}`);
      info.innerHTML = `
        <p class="artwork-year">${aw.year}</p>
        <h2 class="artwork-title">${aw.title}</h2>
        <p class="artwork-artist">${aw.artist}</p>
        <p class="artwork-museum">${aw.museum}</p>
      `;

      return { wrapper, info };
    }

    // Scroll container height
    const SECTION_HEIGHT = window.innerHeight;
    scrollCont.style.height = `${artworks.length * SECTION_HEIGHT}px`;
    counterTotal.textContent = String(artworks.length).padStart(2, '0');

    // Build all vinyls and append to stage
    const vinyls = artworks.map((aw, i) => {
      const { wrapper, info } = buildVinyl(aw, i);
      stage.appendChild(wrapper);
      stage.appendChild(info);
      return { wrapper, info };
    });

    // Build dot nav
    artworks.forEach((aw, i) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.setAttribute('aria-label', `Ir a: ${aw.title} (${aw.artist})`);
      btn.setAttribute('aria-current', i === 0 ? 'true' : 'false');
      btn.addEventListener('click', () => scrollToArtwork(i));
      li.appendChild(btn);
      dotNav.appendChild(li);
    });

    // Measure vinyl radius
    function measureVinyl() {
      const rect = vinyls[0].wrapper.getBoundingClientRect();
      vinylRadius = rect.width / 2 || 240;
      scrollCont.style.height = `${artworks.length * window.innerHeight}px`;
    }
    measureVinyl();
    window.addEventListener('resize', measureVinyl, { passive: true });

    // ── Color utils ───────────────────────────────────────────────────────────
    function lerp(a, b, t) { return a + (b - a) * t; }

    function rgbStr(r, g, b, a = 1) {
      return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a})`;
    }

    function lerpRGB(c1, c2, t) {
      return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
    }

    function hexToRgb(hex) {
      const m = hex.replace('#','').match(/.{2}/g).map(x => parseInt(x,16));
      return m;
    }

    function lerpHex(h1, h2, t) {
      const c1 = hexToRgb(h1), c2 = hexToRgb(h2);
      const r = lerpRGB(c1, c2, t);
      return `rgb(${Math.round(r[0])},${Math.round(r[1])},${Math.round(r[2])})`;
    }

    // ── Rolling physics ───────────────────────────────────────────────────────
    // Distance traveled (px) → rotation in degrees
    function distToAngle(dist) {
      return (dist / vinylRadius) * (180 / Math.PI);
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function applyVinylTransform(wrapper, tx, ty, rotDeg, opacity) {
      wrapper.style.transform = `translateX(${tx}px) translateY(${ty}px) rotate(${rotDeg}deg)`;
      wrapper.style.opacity = opacity;
    }

    let prevActiveIdx = -1;

    function render(scrollY) {
      const vh = window.innerHeight;
      const raw = scrollY / vh;
      const clampedRaw = Math.max(0, Math.min(artworks.length - 1, raw));

      const baseIdx = Math.min(Math.floor(clampedRaw), artworks.length - 2);
      const progress = clampedRaw - baseIdx; // 0..1

      const stageW = stage.getBoundingClientRect().width || window.innerWidth;
      const travelDist = stageW * 1.2;

      // Easing for smooth feel
      const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      const p = ease(Math.min(1, Math.max(0, progress)));

      // Active artwork index
      const activeIdx = progress < 0.5 ? baseIdx : baseIdx + 1;

      artworks.forEach((_, i) => {
        const { wrapper, info } = vinyls[i];

        let tx = 0, rotDeg = 0, opacity = 0, infoOpacity = 0;

        if (i === baseIdx) {
          // Exiting vinyl: rolls left
          tx = -p * travelDist;
          rotDeg = distToAngle(Math.abs(tx));
          opacity = 1 - p * 1.4;
          infoOpacity = 1 - p * 2.5;
        } else if (i === baseIdx + 1) {
          // Entering vinyl: rolls in from right
          tx = (1 - p) * travelDist;
          rotDeg = distToAngle(travelDist) - distToAngle(Math.abs(tx));
          opacity = Math.min(1, p * 1.4);
          infoOpacity = (p - 0.5) * 2.5;
        } else if (i < baseIdx) {
          tx = -travelDist;
          rotDeg = distToAngle(travelDist);
          opacity = 0;
        } else {
          tx = travelDist;
          rotDeg = 0;
          opacity = 0;
        }

        if (prefersReducedMotion) {
          wrapper.style.transform = 'none';
          wrapper.style.opacity = i === activeIdx ? '1' : '0';
          info.style.opacity = i === activeIdx ? '1' : '0';
        } else {
          applyVinylTransform(wrapper, tx, 0, rotDeg, Math.max(0, Math.min(1, opacity)));
          info.style.opacity = Math.max(0, Math.min(1, infoOpacity));
        }

        const isActive = i === activeIdx;
        wrapper.setAttribute('aria-hidden', isActive ? 'false' : 'true');
      });

      // Update background atmosphere
      const bgA = artworks[baseIdx].bg;
      const bgB = artworks[Math.min(baseIdx + 1, artworks.length - 1)].bg;
      const glowA = artworks[baseIdx].glow;
      const glowB = artworks[Math.min(baseIdx + 1, artworks.length - 1)].glow;
      const accentA = artworks[baseIdx].accent;
      const accentB = artworks[Math.min(baseIdx + 1, artworks.length - 1)].accent;

      const bg = lerpRGB(bgA, bgB, p);
      const glow = lerpRGB(glowA, glowB, p);
      const accent = lerpHex(accentA, accentB, p);

      document.body.style.background = rgbStr(...bg);
      atmosphere.style.background =
        `radial-gradient(ellipse 80% 70% at 50% 58%, ${rgbStr(...glow, 0.35)} 0%, transparent 70%)`;

      // Update CSS var for dots accent
      document.documentElement.style.setProperty('--accent', accent);

      // Update dot nav
      const dots = dotNav.querySelectorAll('button');
      dots.forEach((btn, i) => {
        btn.setAttribute('aria-current', i === activeIdx ? 'true' : 'false');
      });

      // Counter
      counterCur.textContent = String(activeIdx + 1).padStart(2, '0');

      // Announce artwork change to screen readers
      if (activeIdx !== prevActiveIdx) {
        const aw = artworks[activeIdx];
        liveRegion.textContent = `Obra ${activeIdx + 1} de ${artworks.length}: ${aw.title} de ${aw.artist}, ${aw.year}`;
        prevActiveIdx = activeIdx;
      }

      // Hide scroll arrow at end
      scrollArrow.style.opacity = clampedRaw >= artworks.length - 1.2 ? '0' : '0.45';
    }

    // ── Scroll listener ───────────────────────────────────────────────────────
    function onScroll() {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        if (window.scrollY !== lastScrollY) {
          lastScrollY = window.scrollY;
          render(lastScrollY);
        }
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    render(0);

    // ── Keyboard navigation ───────────────────────────────────────────────────
    function scrollToArtwork(idx) {
      const clampedIdx = Math.max(0, Math.min(artworks.length - 1, idx));
      const targetY = clampedIdx * window.innerHeight;
      if (prefersReducedMotion) {
        window.scrollTo({ top: targetY });
      } else {
        window.scrollTo({ top: targetY, behavior: 'smooth' });
      }
    }

    document.addEventListener('keydown', e => {
      const cur = Math.round(window.scrollY / window.innerHeight);
      if (e.key === 'ArrowDown' || e.key === 'PageDown') {
        e.preventDefault();
        scrollToArtwork(cur + 1);
      } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        scrollToArtwork(cur - 1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        scrollToArtwork(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        scrollToArtwork(artworks.length - 1);
      }
    });

    // ── Idle shimmer rotation ─────────────────────────────────────────────────
    // Gentle continuous idle rotation on the sheen overlay only (not the whole disc)
    if (!prefersReducedMotion) {
      let sheenAngle = 0;
      function animateSheen() {
        sheenAngle += 0.12;
        const progress = window.scrollY / window.innerHeight;
        const activeIdx = Math.min(Math.round(progress), artworks.length - 1);
        const sheen = vinyls[activeIdx]?.wrapper.querySelector('.vinyl-sheen');
        if (sheen) {
          sheen.style.transform = `rotate(${sheenAngle}deg)`;
        }
        requestAnimationFrame(animateSheen);
      }
      requestAnimationFrame(animateSheen);
    }

  })();
  </script>
</body>
</html>
