<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIINYL — Vinyl Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- VIEWPORT CENTERING WRAPPER -->
  <div class="viewport-wrap">

    <!-- STAGE: the main rounded container -->
    <div class="stage" id="stage">

      <!-- NAV -->
      <nav class="nav" role="navigation" aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="#">SHOP</a></li>
          <li><a href="#">ARTISTS</a></li>
          <li><a href="#">TOP</a></li>
        </ul>
        <div class="nav-brand">VIINYL</div>
        <div class="nav-hamburger" role="button" tabindex="0" aria-label="Menu">
          <span class="ham-line ham-line--long"></span>
          <span class="ham-line ham-line--short"></span>
        </div>
      </nav>

      <!-- ═══════════════════════════════════════════════════
           SCENE 1: DARK HERO
      ════════════════════════════════════════════════════ -->
      <section class="scene scene--dark-hero" id="scene-dark-hero" aria-label="Dark Hero">

        <!-- Left portrait panel -->
        <div class="hero-portrait-panel"></div>

        <!-- Giant green vinyl (hero) -->
        <div class="hero-vinyl-wrap" id="hero-vinyl-wrap">
          <div class="hero-vinyl-disc" id="hero-vinyl-disc">
            <!-- Album cover with video (appears after disc) -->
          <div class="hero-vinyl-cover" id="hero-vinyl-cover">
            <video class="cover-video" id="cover-video" autoplay muted loop playsinline>
              <!-- Replace with your video source -->
              <!-- <source src="cover-video.mp4" type="video/mp4" /> -->
            </video>
          </div>

          <!-- Green vinyl SVG -->
            <svg class="vinyl-svg" viewBox="0 0 200 200" aria-hidden="true">
              <defs>
                <clipPath id="hero-label-clip">
                  <circle cx="100" cy="100" r="42"/>
                </clipPath>
                <radialGradient id="hero-groove-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="rgba(20,160,55,0.82)"/>
                  <stop offset="100%" stop-color="rgba(10,100,30,0.9)"/>
                </radialGradient>
              </defs>
              <!-- Base disc -->
              <circle cx="100" cy="100" r="100" fill="rgba(20,160,55,0.82)"/>
              <!-- Groove rings -->
              <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="52.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="55" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="57.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="62.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="65" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="67.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="72.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="77.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="82.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="87.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="92.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
              <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
              <circle cx="100" cy="100" r="97.5" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

              <ellipse cx="80" cy="65" rx="30" ry="18" fill="rgba(255,255,255,0.06)" transform="rotate(-35 100 100)"/>
              <!-- Label -->
              <circle cx="100" cy="100" r="42" fill="#e8e0d0"/>
              <circle cx="100" cy="100" r="41" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
              <text x="100" y="93" text-anchor="middle" font-size="5.5" font-family="sans-serif" font-weight="700" fill="#1a1a1a" letter-spacing="0.5">DON'T CARE</text>
              <text x="100" y="101" text-anchor="middle" font-size="4" font-family="sans-serif" fill="#555" letter-spacing="0.3">A&amp;M RECORDS</text>

              <circle cx="100" cy="100" r="4.5" fill="#f5f5f0"/>
              <circle cx="100" cy="100" r="3" fill="#d0cdc8"/>
            </svg>
          </div>
        </div>

        <!-- Right info block -->
        <div class="hero-info" id="hero-info">
          <h1 class="hero-title">DON'T CARE<br/>KLARK KENT</h1>
          <p class="hero-desc">
            A rare limited-edition pressing from 1980.<br/>
            Stewart Copeland's alter ego project — post-punk perfection on green vinyl.
          </p>
          <button class="hero-purchase-btn" type="button">PURCHASE</button>
        </div>

      </section>

            </svg>
          </div>
        </div>

        <!-- Right partial vinyl -->
        <div class="vinyl-side vinyl-side--right" id="vinyl-right-green">
          <div class="vinyl-disc-wrap">
            <svg class="vinyl-svg" viewBox="0 0 200 200" aria-hidden="true">
              <circle cx="100" cy="100" r="100" fill="rgba(18,140,50,0.75)"/>

      </section>

      <!-- ═══════════════════════════════════════════════════
           DIAGONAL WIPE OVERLAY
      ════════════════════════════════════════════════════ -->
      <div class="wipe-overlay" id="wipe-overlay" aria-hidden="true">
        <svg class="wipe-svg" id="wipe-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <polygon id="wipe-polygon" points="110,0 110,0 110,100 110,100"/>
        </svg>
      </div>

      ════════════════════════════════════════════════════ -->
